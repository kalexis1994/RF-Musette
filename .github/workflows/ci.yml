name: Rust quality

on:
  push:
    branches: ["**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  rust:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: RF-Musette
    steps:
      - name: Check out RF-Musette
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: RF-Musette
          persist-credentials: false
      - name: Check out the compatible SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          # The same RackForge as package.yml. See docs/DEVELOPMENT.md.
          ref: de3ffc47230bd947d13bcce478c467c3988f2669
          path: rackforge
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Check lints
        run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the engine, the plugin contract and the laboratory
        run: cargo test --locked --workspace
      - name: Build the laboratory
        run: cargo build --locked --release --workspace
      - name: Build the portable plugin
        run: cargo build --locked --release --target wasm32-unknown-unknown -p rf-musette-plugin
      - name: Render a reference
        run: cargo run --locked --release -p rf-musette-lab -- render --output renders/ci.wav --hold 0.5 --lead-in 0.1
      - name: Verify the reference file
        run: cargo run --locked --release -p rf-musette-lab -- inspect renders/ci.wav

  package:
    name: Package
    needs: rust
    uses: ./.github/workflows/package.yml
