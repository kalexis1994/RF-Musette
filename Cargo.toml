[workspace]
resolver = "3"
members = [
    "crates/rf-musette-dsp",
    "crates/rf-musette-analysis",
    "crates/rf-musette-plugin",
    "crates/rf-musette-ui",
    "tools/rf-musette-lab",
]

[workspace.package]
version = "0.13.24"
edition = "2024"
rust-version = "1.98"
license = "GPL-2.0-or-later"
publish = false

[workspace.dependencies]
rf-musette-dsp = { path = "crates/rf-musette-dsp" }
rf-musette-analysis = { path = "crates/rf-musette-analysis" }
rf-musette-ui = { path = "crates/rf-musette-ui" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
# Development checkout, deliberately explicit. See docs/DEVELOPMENT.md.
rackforge-plugin-sdk = { git = "https://github.com/kalexis1994/rackforge", rev = "6fdbe643fe470ce62cb17c7ea982d5d8881b3854" }
# The program documents and their envelopes, RackForge's own.
rackforge-program-api = { git = "https://github.com/kalexis1994/rackforge", rev = "6fdbe643fe470ce62cb17c7ea982d5d8881b3854" }
# RackForge's own schema validator and controller roles, for the contract tests.
rackforge-plugin-api = { git = "https://github.com/kalexis1994/rackforge", rev = "6fdbe643fe470ce62cb17c7ea982d5d8881b3854" }
# RackForge's control layouts and link modes, for the layout's contract test.
rackforge-midi-api = { git = "https://github.com/kalexis1994/rackforge", rev = "6fdbe643fe470ce62cb17c7ea982d5d8881b3854" }

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
all = "warn"

[profile.release]
lto = "thin"
codegen-units = 1

# The physics tests simulate seconds of a reed at 96 kHz and more; unoptimised
# they take minutes.
[profile.dev]
opt-level = 2
