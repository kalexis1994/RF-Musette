name: Release RF-Musette

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: rf-musette-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  release:
    name: Validate and publish RF-Musette
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: RF-Musette
    steps:
      - name: Check out the tagged RF-Musette source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          path: RF-Musette
          persist-credentials: false
      - name: Check out the compatible SDK and its packager
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          repository: kalexis1994/rackforge
          # The same RackForge as ci.yml. See docs/DEVELOPMENT.md.
          ref: 988e4b70b0bb49eb8f99438dc6f332394b073c50
          path: rackforge
          persist-credentials: false
      - name: Match the tag to the package version
        id: version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          MANIFEST="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/rackforge-plugin.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$MANIFEST" = "$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the engine, the plugin contract and the laboratory
        run: cargo test --locked --release --workspace
      - name: Install the system libraries RackForge's tools link against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Build RackForge's packager and inspector
        working-directory: rackforge
        run: cargo build --locked --release -p rackforge-store -p rackforge-core
      - name: Install the wasm-bindgen CLI the PLAY surface pins
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Build, inspect, smoke-test and pack the plugin
        run: cargo run --locked --release -p rf-musette-lab -- package
      - name: Write SHA-256 checksums
        shell: bash
        run: |
          cd dist
          VERSION="${{ steps.version.outputs.version }}"
          sha256sum "RF-Musette-$VERSION.rfplugin" > "RF-Musette-$VERSION.rfplugin.sha256"
          cp "RF-Musette-$VERSION.rfplugin" RF-Musette.rfplugin
          sha256sum RF-Musette.rfplugin > RF-Musette.rfplugin.sha256
      - name: Preserve the validated release artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: RF-Musette-${{ steps.version.outputs.version }}
          path: |
            RF-Musette/dist/RF-Musette-${{ steps.version.outputs.version }}.rfplugin
            RF-Musette/dist/RF-Musette-${{ steps.version.outputs.version }}.rfplugin.sha256
            RF-Musette/dist/RF-Musette.rfplugin
            RF-Musette/dist/RF-Musette.rfplugin.sha256
          if-no-files-found: error
          compression-level: 0
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ steps.version.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "RF-Musette $VERSION" \
            --generate-notes \
            "dist/RF-Musette-$VERSION.rfplugin" \
            "dist/RF-Musette-$VERSION.rfplugin.sha256" \
            dist/RF-Musette.rfplugin \
            dist/RF-Musette.rfplugin.sha256
