name: Package RF-Musette

# One .rfplugin with everything: the wasm-v1 component every RackForge host
# runs, and the same processor built natively for each platform below, which
# an official install runs in the component's place. Every native build that
# a runner can execute is held to the component first: every program, played
# through both, must come out the same bits (`rackforge-core compare-native`).
# A new platform is one more entry in the matrix.

on:
  workflow_call:
    outputs:
      version:
        description: The plugin version the package carries.
        value: ${{ jobs.component.outputs.version }}
      artifact:
        description: The artifact holding RF-Musette.rfplugin and its checksum.
        value: ${{ jobs.pack.outputs.artifact }}

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # The RackForge whose SDK the plugin builds against and whose tools check
  # and pack it. See docs/DEVELOPMENT.md.
  RACKFORGE_REF: de3ffc47230bd947d13bcce478c467c3988f2669

jobs:
  component:
    name: Component
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      version: ${{ steps.package.outputs.version }}
    defaults:
      run:
        working-directory: RF-Musette
    steps:
      - name: Check out RF-Musette
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: RF-Musette
          persist-credentials: false
      - name: Check out the compatible SDK and its tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          ref: ${{ env.RACKFORGE_REF }}
          path: rackforge
          persist-credentials: false
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Install the system libraries RackForge's tools link against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Build RackForge's packager and inspector
        working-directory: rackforge
        run: cargo build --locked --release -p rackforge-store -p rackforge-core
      - name: Install the wasm-bindgen CLI the PLAY surface pins
        run: cargo install --locked wasm-bindgen-cli --version 0.2.127
      - name: Build, inspect, smoke-test and pack the component
        id: package
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/rackforge-plugin.toml | head -n 1)"
          if [[ -z "$version" ]]; then
            echo 'Could not read the plugin version from rackforge-plugin.toml.' >&2
            exit 1
          fi
          cargo run --locked --release -p rf-musette-lab -- package
          # The package exactly as packed, the component as binaryen left it:
          # what every native build is compared with and packed beside.
          mkdir -p ../component
          unzip -q "dist/RF-Musette-$version.rfplugin" -d ../component
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Keep the component package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rf-musette-component
          path: component
          if-no-files-found: error
          retention-days: 7

  native:
    name: Native ${{ matrix.platform }}
    needs: component
    strategy:
      fail-fast: false
      matrix:
        include:
          # The oldest glibc a runner offers, so the library loads on every
          # distribution as new or newer; on an older one the host runs the
          # component instead.
          - platform: linux-x86_64
            os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            library: librf_musette_plugin.so
            compare: true
          - platform: linux-aarch64
            os: ubuntu-22.04-arm
            target: aarch64-unknown-linux-gnu
            library: librf_musette_plugin.so
            compare: true
          - platform: windows-x86_64
            os: windows-2022
            target: x86_64-pc-windows-msvc
            library: rf_musette_plugin.dll
            compare: true
          - platform: macos-aarch64
            os: macos-14
            target: aarch64-apple-darwin
            library: librf_musette_plugin.dylib
            compare: true
          # Built, not run: no runner executes Android. The packer still
          # refuses it unless it exports the portable entry.
          - platform: android-aarch64
            os: ubuntu-24.04
            target: aarch64-linux-android
            library: librf_musette_plugin.so
            compare: false
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
        working-directory: RF-Musette
    steps:
      - name: Check out RF-Musette
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: RF-Musette
          persist-credentials: false
      - name: Check out the compatible SDK and its tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          ref: ${{ env.RACKFORGE_REF }}
          path: rackforge
          persist-credentials: false
      - name: Install the pinned Rust toolchain and the target
        run: |
          rustup show
          rustup target add ${{ matrix.target }}
      - name: Use the NDK's linker
        if: matrix.platform == 'android-aarch64'
        run: |
          linker="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin/aarch64-linux-android26-clang"
          test -x "$linker"
          echo "CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=$linker" >> "$GITHUB_ENV"
      - name: Build the native plugin
        run: cargo build --locked --release --target ${{ matrix.target }} -p rf-musette-plugin
      - name: Install the system libraries RackForge's tools link against
        if: matrix.compare && runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Build RackForge's comparison tool
        if: matrix.compare
        working-directory: rackforge
        run: cargo build --locked --release -p rackforge-core --bin rackforge-core
      - name: Fetch the component package
        if: matrix.compare
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rf-musette-component
          path: component
      - name: Hold the native build to the component
        if: matrix.compare
        run: |
          ../rackforge/target/release/rackforge-core compare-native \
            ../component \
            "target/${{ matrix.target }}/release/${{ matrix.library }}"
      - name: Keep the native build
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: rf-musette-native-${{ matrix.platform }}
          path: RF-Musette/target/${{ matrix.target }}/release/${{ matrix.library }}
          if-no-files-found: error
          retention-days: 7

  pack:
    name: Pack every platform
    needs: [component, native]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    outputs:
      artifact: ${{ steps.artifact.outputs.name }}
    defaults:
      run:
        shell: bash
    steps:
      - name: Check out the compatible tools
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          ref: ${{ env.RACKFORGE_REF }}
          path: rackforge
          persist-credentials: false
      - name: Install the system libraries RackForge's tools link against
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libasound2-dev libudev-dev pkg-config
      - name: Build RackForge's packager and inspector
        working-directory: rackforge
        run: |
          rustup show
          cargo build --locked --release -p rackforge-store -p rackforge-core
      - name: Fetch the component package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: rf-musette-component
          path: component
      - name: Fetch the native builds
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: rf-musette-native-*
          path: native
      - name: Pack the component with every native build
        run: |
          tools=rackforge/target/release
          natives=()
          for directory in native/rf-musette-native-*; do
            platform="${directory#native/rf-musette-native-}"
            library="$(find "$directory" -maxdepth 1 -type f | head -n 1)"
            natives+=(--native "$platform=$library")
          done
          mkdir -p artifacts
          # The component is packed as compared: already optimised, not again.
          RACKFORGE_OPTIMIZE_PLUGINS=0 "$tools/rackforge-store" pack-wasm \
            component component/component.wasm artifacts/RF-Musette.rfplugin "${natives[@]}"
      - name: Check the package as a host will install it
        run: |
          tools=rackforge/target/release
          mkdir check
          unzip -q artifacts/RF-Musette.rfplugin -d check
          "$tools/rackforge-core" inspect check
          version="${{ needs.component.outputs.version }}"
          "$tools/rackforge-store" install-local artifacts/RF-Musette.rfplugin store --official
          # Installed as the official set installs it, this runner's own
          # build is the one that loads.
          "$tools/rackforge-core" smoke "store/packages/org.rackforge.musette/$version" \
            --preset research --data-root smoke-data 2> smoke.log
          cat smoke.log
          grep -q '^PLUGIN_NATIVE_BUILD id=org.rackforge.musette' smoke.log
          (cd artifacts && sha256sum RF-Musette.rfplugin > RF-Musette.rfplugin.sha256)
          cat artifacts/RF-Musette.rfplugin.sha256
      - name: Name the artifact
        id: artifact
        run: echo "name=RF-Musette-${{ needs.component.outputs.version }}-${{ github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Upload the package
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.artifact.outputs.name }}
          path: |
            artifacts/RF-Musette.rfplugin
            artifacts/RF-Musette.rfplugin.sha256
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
