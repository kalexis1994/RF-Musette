# Schema 1 uses RackForge's generic identity: a branded schema 3 package
# follows once product artwork exists.
schema_version = 1
id = "org.rackforge.musette"
name = "RF-Musette"
vendor = "RackForge"
version = "0.12.1"
description = "Physically modelled accordion: free reeds driven by the bellows, with no samples"
kind = "instrument"
state_version = 2
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

# The PLAY surface: crates/rf-musette-ui, built into web/ by
# `rf-musette-lab web-ui`. One surface: the instrument has nothing to load,
# so no CONFIG.
[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"
