name: Release RF-Musette

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
  group: rf-musette-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always

jobs:
  validate:
    name: Validate the tagged source
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    defaults:
      run:
        working-directory: RF-Musette
    steps:
      - name: Check out the tagged RF-Musette source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: RF-Musette
          persist-credentials: false
      - name: Check out the compatible SDK
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: kalexis1994/rackforge
          # The same RackForge as package.yml. See docs/DEVELOPMENT.md.
          ref: e68611b4bed5dcc351522153894a76a08c89b1d2
          path: rackforge
          persist-credentials: false
      - name: Match the tag to the package version
        shell: bash
        run: |
          VERSION="$(python3 - <<'PY'
          import tomllib
          with open("Cargo.toml", "rb") as source:
              print(tomllib.load(source)["workspace"]["package"]["version"])
          PY
          )"
          MANIFEST="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' package/rackforge-plugin.toml | head -n 1)"
          test "$GITHUB_REF_NAME" = "v$VERSION"
          test "$MANIFEST" = "$VERSION"
      - name: Install the pinned Rust toolchain
        run: rustup show
      - name: Check formatting and lints
        run: |
          cargo fmt --all -- --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Test the engine, the plugin contract and the laboratory
        run: cargo test --locked --release --workspace

  package:
    name: Package
    needs: validate
    uses: ./.github/workflows/package.yml

  publish:
    name: Publish the GitHub release
    needs: package
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Fetch the validated package
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ needs.package.outputs.artifact }}
          path: dist
      - name: Write the versioned copy and its checksums
        shell: bash
        run: |
          cd dist
          VERSION="${{ needs.package.outputs.version }}"
          sha256sum -c RF-Musette.rfplugin.sha256
          cp RF-Musette.rfplugin "RF-Musette-$VERSION.rfplugin"
          sha256sum "RF-Musette-$VERSION.rfplugin" > "RF-Musette-$VERSION.rfplugin.sha256"
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        shell: bash
        run: |
          VERSION="${{ needs.package.outputs.version }}"
          gh release create "$GITHUB_REF_NAME" \
            --verify-tag \
            --title "RF-Musette $VERSION" \
            --generate-notes \
            "dist/RF-Musette-$VERSION.rfplugin" \
            "dist/RF-Musette-$VERSION.rfplugin.sha256" \
            dist/RF-Musette.rfplugin \
            dist/RF-Musette.rfplugin.sha256
