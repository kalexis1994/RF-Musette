# Schema 3: the package's own identity (branding/), and `short_name` for
# narrow controller surfaces -- ASCII, at most eight characters.
schema_version = 3
id = "org.rackforge.musette"
name = "RF-Musette"
short_name = "MUSETTE"
vendor = "RackForge"
version = "0.13.22"
description = "Physically modelled accordion: free reeds driven by the bellows, with no samples"
kind = "instrument"
state_version = 2
capabilities = ["audio_output", "midi_input", "presets", "state"]
ui_layouts = ["little@1"]
# CONFIG exports and imports the player's own programs (.rfmusette).
config_mode = true

[api]
major = 1
minor = 11

[component]
abi = "wasm-v1"
path = "component.wasm"
runtime_descriptor = "metadata/runtime.json"
parameter_schema = "metadata/parameters.json"
preset_catalog = "metadata/presets.json"

# The surfaces: crates/rf-musette-ui, built into web/ by
# `rf-musette-lab web-ui`. PLAY is the instrument and saves programs; CONFIG
# carries them off the machine and back.
[web_ui]
api_version = 1

[[web_ui.surfaces]]
kind = "play"
entry = "web/play.html"

[[web_ui.surfaces]]
kind = "config"
entry = "web/config.html"

# docs/PLUGIN_BRANDING.md in RackForge: 512x512, 1600x400 and 1920x1080 PNG.
# The colours are the panel's: the red sheet's deepest and the pearl's red.
[branding]
icon = "branding/icon.png"
banner = "branding/banner.png"
splash = "branding/splash.png"
background_color = "#26060A"
accent_color = "#EC2634"

# What the instrument would like after it in PLAY, for the player to take or
# leave. The plugin delivers the instrument as recorded -- microphones, room
# and preamp; its colour in a mix is the player's, so the EQ starts flat.
[[suggested_chain]]
plugin = "org.rackforge.rf-eq"
preset = "flat"
